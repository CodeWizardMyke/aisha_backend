# fly.toml app configuration file generated for manager-back on 2026-08-17T23:45:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'manager-back'
primary_region = 'gru'

[build]

[env]
  DB_DIALECT = 'postgres'
  DB_PORT = '5433'
  DB_USERNAME = 'postgres'
  LOG_LEVEL = 'debug'
  RAILS_ENV = 'production'
  S3_BUCKET = 'my-app-production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 256
